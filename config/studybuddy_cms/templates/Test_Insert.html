<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Test Database Creator</title>
        
        <style>
            body {
                margin: 0;
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                font-family: Arial, sans-serif;
                background-color: #f4f4f4;
            }

            .container {
                text-align: center;
            }

            button {
                width: 200px;
                padding: 12px;
                margin: 10px;
                font-size: 16px;
                cursor: pointer;
                border: none;
                border-radius: 5px;
                background-color: #007BFF;
                color: white;
            }

            button:hover {
                background-color: #0056b3;
            }
        </style>
    </head>

    <body>
        <div class="container">
            <h2>{{ display_message }}</h2>

            <form action="/registration" method="get">
                <button type="submit">Go to Registration</button>
            </form>

            <form action="/login" method="get">
                <button type="submit">Go to Login</button>
            </form>
        </div>
    </body>
</html>
